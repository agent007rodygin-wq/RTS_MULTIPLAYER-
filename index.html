
<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Game Wiki Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
       * Shared modal sizing tokens (build menu, build confirmation, etc.).
       * These custom properties are consumed in App.tsx via
       *   width:  min(var(--ui-modal-width),  calc(100vw - 32px))
       *   height: min(var(--ui-modal-height), calc(100vh - 32px))
       *   padding: var(--ui-modal-padding-top) ... var(--ui-modal-padding-left)
       * They were referenced but never defined after a refactor, which made the
       * min()/padding declarations invalid so the modals collapsed to `auto`
       * width (the narrow "Меню строительства" bug). Restoring the original
       * 960x700 base size + 28/70/52/52 padding keeps the intended proportions
       * while the min() clamps still make it responsive on small screens.
       */
      :root {
        --ui-modal-width: 960px;
        --ui-modal-height: 700px;
        --ui-modal-padding-top: 28px;
        --ui-modal-padding-right: 70px;
        --ui-modal-padding-bottom: 52px;
        --ui-modal-padding-left: 52px;
      }

      /* Scale the modal tokens down on smaller / shorter viewports so the
         building menu keeps sensible proportions instead of always being
         clamped hard against the viewport edges. */
      @media (max-width: 1024px) {
        :root {
          --ui-modal-width: calc(100vw - 32px);
        }
      }
      @media (max-height: 760px) {
        :root {
          --ui-modal-height: calc(100vh - 32px);
          --ui-modal-padding-top: 20px;
          --ui-modal-padding-bottom: 36px;
        }
      }

      /* Compact landscape mobile viewports */
      @media (max-height: 540px) {
        :root {
          --ui-modal-width: min(880px, calc(100vw - 16px));
          --ui-modal-height: calc(100vh - 12px);
          --ui-modal-padding-top: 6px;
          --ui-modal-padding-right: 28px;
          --ui-modal-padding-bottom: 10px;
          --ui-modal-padding-left: 18px;
          --chat-width: min(340px, 42vw);
          --chat-height: clamp(120px, 34vh, 165px);
        }

        /* BuildMenuModal compact scaling */
        .build-menu-header {
          margin-top: 2px !important;
          margin-bottom: 2px !important;
          padding: 0 4px !important;
        }
        .build-menu-title {
          font-size: 13px !important;
        }
        .build-menu-title-wrap {
          padding: 3px 18px !important;
          border-radius: 10px !important;
        }
        .build-menu-search-wrap {
          width: 140px !important;
          right: 32px !important;
          top: 0px !important;
        }
        .build-menu-search {
          height: 26px !important;
          font-size: 11px !important;
          padding: 2px 8px !important;
        }
        .build-menu-close-btn {
          width: 28px !important;
          height: 28px !important;
          top: 0px !important;
          right: -12px !important;
        }
        .build-menu-sidebar {
          width: 88px !important;
          padding-right: 2px !important;
        }
        .build-menu-tab-btn {
          padding: 4px 6px !important;
          font-size: 10px !important;
          margin-bottom: 2px !important;
          gap: 4px !important;
        }
        .build-menu-tab-btn svg {
          width: 14px !important;
          height: 14px !important;
        }
        .build-menu-content {
          padding-left: 6px !important;
        }
        .building-card-item {
          padding: 2px !important;
          border-width: 1.5px !important;
        }
        .building-card-img-wrap {
          height: 44px !important;
          margin-bottom: 1px !important;
        }
        .building-card-title {
          font-size: 9.5px !important;
          margin-bottom: 1px !important;
        }
        .building-card-cost {
          font-size: 9.5px !important;
          margin-bottom: 0px !important;
        }
        .building-card-cost img {
          width: 12px !important;
          height: 12px !important;
          margin-right: 2px !important;
        }

        /* ProfileModal compact scaling */
        .profile-modal-header {
          margin-top: 2px !important;
          margin-bottom: 2px !important;
        }
        .profile-modal-header h2 {
          font-size: 13px !important;
        }
        .profile-modal-header > div {
          padding: 3px 18px !important;
        }
        .profile-modal-close-btn {
          width: 28px !important;
          height: 28px !important;
          top: 5% !important;
          right: 5% !important;
        }
        .profile-tabs-row {
          margin-bottom: 4px !important;
          padding-bottom: 2px !important;
        }
        .profile-tab-btn {
          padding: 3px 8px !important;
          font-size: 10px !important;
        }
        .profile-content-scroll {
          padding: 4px !important;
        }

        /* Chat compact scaling */
        .chat-window {
          width: min(340px, 42vw) !important;
          height: clamp(120px, 34vh, 165px) !important;
          bottom: 8px !important;
          left: 8px !important;
        }
        .chat-tabs {
          height: 28px !important;
        }
        .chat-tabs button {
          font-size: 10.5px !important;
          padding: 0 6px !important;
        }
        .chat-input-area {
          padding: 2px 4px !important;
        }
        .chat-input-area input {
          font-size: 11px !important;
          padding: 2px 6px !important;
        }
        .chat-input-area button {
          font-size: 10px !important;
          padding: 2px 6px !important;
        }

        /* DailyRewardModal compact scaling */
        .daily-reward-gift-img {
          width: 44px !important;
          height: 44px !important;
        }
        .daily-reward-title {
          font-size: 13px !important;
          line-height: 1.15 !important;
        }
        .daily-reward-desc {
          font-size: 10px !important;
          margin-top: 3px !important;
          margin-bottom: 4px !important;
          line-height: 1.25 !important;
        }
        .daily-reward-code-box {
          padding: 3px 8px !important;
          max-width: 360px !important;
        }
        .daily-reward-btn {
          padding: 4px 14px !important;
          font-size: 11px !important;
        }
        .daily-reward-card {
          min-height: 52px !important;
          padding: 2px 4px !important;
        }
        .daily-reward-card-img {
          width: 22px !important;
          height: 22px !important;
        }
        .daily-reward-card-amt {
          font-size: 9px !important;
        }
        .daily-reward-streak-badge {
          padding: 2px 8px !important;
          font-size: 10px !important;
        }
        .daily-reward-claim-btn {
          padding: 5px 20px !important;
          font-size: 12px !important;
        }
      }

      /* Mobile optimizations - Rise of Kingdoms style */
      @media (max-width: 768px), (max-height: 540px) {
        html, body {
          overscroll-behavior: none;
        }
        
        /* Compact resource text */
        .resource-text {
          font-size: 0.6rem !important;
        }
        
        .player-name {
          font-size: 0.75rem !important;
        }
        
        .stat-bars {
          height: 8px !important;
          width: 50px !important;
        }
        
        /* Chat - minimal on mobile, not half screen */
        .chat-window {
          width: min(var(--chat-width, 360px), calc(100vw - 16px)) !important;
          max-height: 28vh !important;
        }
        @media (orientation: portrait) {
          .chat-window {
            width: calc(100vw - 16px) !important;
            max-height: 20vh !important;
          }
        }
        .chat-window.chat-collapsed {
          max-height: 32px !important;
          height: 32px !important;
        }
        
        /* Smaller control buttons */
        .control-button {
          width: 32px !important;
          height: 32px !important;
        }
        
        /* Game buttons - bottom bar on mobile */
        .game-buttons-right {
          position: fixed !important;
          top: auto !important;
          bottom: 0 !important;
          right: 0 !important;
          left: 0 !important;
          flex-direction: row !important;
          justify-content: space-around !important;
          align-items: center !important;
          background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.5)) !important;
          padding: 4px 8px 6px 8px !important;
          gap: 2px !important;
          border-top: 1px solid rgba(255,255,255,0.1) !important;
          z-index: 60 !important;
        }
        .game-buttons-right .game-button img {
          width: 44px !important;
          height: 44px !important;
        }
        
        /* Resource icons smaller */
        .resource-icon {
          width: 28px !important;
          height: 28px !important;
        }
        
        /* Player info compact */
        .player-info {
          transform: scale(0.55) !important;
          transform-origin: top left !important;
        }
        
        /* Inventory button smaller */
        .inventory-btn img {
          width: 28px !important;
          height: 28px !important;
        }
        
        /* Chat moves above bottom bar */
        .chat-window {
          bottom: 54px !important;
        }
        
        /* Teleport cooldown above bottom bar */
        .teleport-cooldown {
          bottom: 70px !important;
        }
        
        /* Chat input area compact */
        .chat-input-area {
          padding: 3px !important;
          gap: 3px !important;
        }
        .chat-input-area input {
          font-size: 12px !important;
          padding: 4px 8px !important;
        }
        .chat-input-area button {
          padding: 4px 6px !important;
          font-size: 10px !important;
        }
        
        /* Chat messages compact */
        .chat-messages {
          padding: 2px !important;
        }
        .chat-messages .text-sm {
          font-size: 11px !important;
        }
        
        /* Chat tabs compact */
        .chat-tabs button {
          padding: 0 6px !important;
          font-size: 11px !important;
        }
        
        /* Hide online players sidebar on mobile */
        .chat-players-sidebar {
          display: none !important;
        }
        .chat-messages-container {
          width: 100% !important;
        }
        
        /* Zoom controls position */
        .zoom-controls {
          top: 2px !important;
          right: 2px !important;
        }
        .zoom-controls button {
          width: 28px !important;
          height: 28px !important;
          font-size: 14px !important;
        }
        .zoom-controls svg {
          width: 16px !important;
          height: 16px !important;
        }
      }
      
      /* Extra small phones */
      @media (max-width: 480px) {
        .resource-text {
          font-size: 0.55rem !important;
        }
        .player-name {
          font-size: 0.65rem !important;
        }
        .player-info {
          transform: scale(0.45) !important;
          transform-origin: top left !important;
        }
        .game-buttons-right .game-button img {
          width: 38px !important;
          height: 38px !important;
        }
        .resource-icon {
          width: 24px !important;
          height: 24px !important;
        }
      }
      
      /* Landscape mode optimizations */
      @media (max-height: 500px) and (orientation: landscape) {
        .chat-window {
          max-height: 30vh !important;
          bottom: 48px !important;
        }
        .player-info {
          transform: scale(0.5) !important;
          transform-origin: top left !important;
        }
        .game-buttons-right .game-button img {
          width: 36px !important;
          height: 36px !important;
        }
        .game-buttons-right {
          padding: 2px 8px 3px 8px !important;
        }
      }
      /* Minimalist scrollbar for build menu */
      .build-menu-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .build-menu-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .build-menu-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 10px;
      }
      .build-menu-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
      }

      /* Procedural golden shimmer for building titles (GPU compositor accelerated) */
      @keyframes buildingGoldShimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .building-title-shimmer {
        background: linear-gradient(
          115deg,
          #e9d5ff 0%,
          #fbcfe8 20%,
          #fed7aa 38%,
          #fef08a 50%,
          #fffbeb 56%,
          #fef08a 62%,
          #fed7aa 74%,
          #fbcfe8 88%,
          #e9d5ff 100%
        );
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: buildingGoldShimmer 4.5s ease-in-out infinite;
        display: inline-block;
        will-change: background-position;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100 m-0 overflow-hidden notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
