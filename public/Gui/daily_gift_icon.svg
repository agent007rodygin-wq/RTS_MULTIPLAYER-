<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="giftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Box Body Gradient -->
    <linearGradient id="boxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Box Lid Gradient -->
    <linearGradient id="boxLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Ribbon Highlight -->
    <linearGradient id="ribbonGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <!-- Shadow -->
    <radialGradient id="boxShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#giftGlow)"/>

  <!-- Shadow under box -->
  <ellipse cx="64" cy="112" rx="42" ry="10" fill="url(#boxShadow)"/>

  <!-- Box Body -->
  <rect x="26" y="58" width="76" height="50" rx="8" fill="url(#boxBody)" stroke="#78350f" stroke-width="2.5"/>

  <!-- Vertical Ribbon on Body -->
  <rect x="56" y="58" width="16" height="50" fill="url(#ribbonRed)" stroke="#881337" stroke-width="1.5"/>
  <rect x="58" y="58" width="4" height="50" fill="url(#ribbonGleam)" opacity="0.6"/>

  <!-- Box Lid -->
  <rect x="20" y="44" width="88" height="18" rx="5" fill="url(#boxLid)" stroke="#78350f" stroke-width="2.5"/>

  <!-- Vertical Ribbon on Lid -->
  <rect x="56" y="44" width="16" height="18" fill="url(#ribbonRed)" stroke="#881337" stroke-width="1.5"/>
  <rect x="58" y="44" width="4" height="18" fill="url(#ribbonGleam)" opacity="0.6"/>

  <!-- Bow Left Loop -->
  <path d="M64 45 C50 20, 24 24, 40 43 C48 48, 58 46, 64 45 Z" fill="url(#ribbonRed)" stroke="#881337" stroke-width="2"/>
  <path d="M58 40 C48 26, 36 28, 44 41" fill="none" stroke="url(#ribbonGleam)" stroke-width="2" opacity="0.8"/>

  <!-- Bow Right Loop -->
  <path d="M64 45 C78 20, 104 24, 88 43 C80 48, 70 46, 64 45 Z" fill="url(#ribbonRed)" stroke="#881337" stroke-width="2"/>
  <path d="M70 40 C80 26, 92 28, 84 41" fill="none" stroke="url(#ribbonGleam)" stroke-width="2" opacity="0.8"/>

  <!-- Bow Center Knot -->
  <ellipse cx="64" cy="44" rx="7" ry="6" fill="#be123c" stroke="#ffe4e6" stroke-width="1.5"/>

  <!-- Sparkles -->
  <path d="M22 34 L25 38 L22 42 L19 38 Z" fill="#fff" opacity="0.9"/>
  <circle cx="22" cy="38" r="5" fill="#fef08a" opacity="0.4"/>

  <path d="M106 50 L108 53 L106 56 L104 53 Z" fill="#fff" opacity="0.9"/>
  <circle cx="106" cy="53" r="4" fill="#fef08a" opacity="0.4"/>

  <path d="M88 20 L90 23 L88 26 L86 23 Z" fill="#fff" opacity="0.9"/>
  <circle cx="88" cy="23" r="4.5" fill="#fef08a" opacity="0.4"/>
</svg>
