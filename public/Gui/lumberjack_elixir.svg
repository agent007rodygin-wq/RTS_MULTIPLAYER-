<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Forest Elixir Glow -->
    <radialGradient id="forestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Bottle Gradient -->
    <linearGradient id="flaskGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="30%" stop-color="rgba(167,243,208,0.2)"/>
      <stop offset="70%" stop-color="rgba(5,150,105,0.25)"/>
      <stop offset="100%" stop-color="rgba(4,120,87,0.45)"/>
    </linearGradient>

    <!-- Emerald Wood Liquid -->
    <linearGradient id="forestLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <radialGradient id="liquidInnerGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <!-- Rustic Wood Stopper -->
    <linearGradient id="woodBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <filter id="axeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="68" r="56" fill="url(#forestAura)"/>

  <!-- Flask Shadow -->
  <ellipse cx="64" cy="116" rx="34" ry="8" fill="rgba(0,0,0,0.4)"/>

  <!-- Wood & Vine Bound Neck -->
  <polygon points="56,12 72,12 70,24 58,24" fill="url(#woodBark)" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="64" cy="25" rx="9.5" ry="3" fill="#b45309" stroke="#451a03" stroke-width="1"/>

  <!-- Bottle Neck -->
  <rect x="58" y="24" width="12" height="18" fill="url(#flaskGlass)" stroke="#34d399" stroke-width="1.2"/>

  <!-- Hexagonal / Potion Flask Body -->
  <polygon points="64,40 98,62 94,104 64,114 34,104 30,62"
           fill="url(#flaskGlass)" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>

  <!-- Clip for Liquid -->
  <clipPath id="lumberFlaskClip">
    <polygon points="64,42 96,63 92,102 64,112 36,102 32,63"/>
  </clipPath>

  <!-- Liquid inside -->
  <g clip-path="url(#lumberFlaskClip)">
    <rect x="25" y="52" width="78" height="65" fill="url(#forestLiquid)"/>
    <ellipse cx="64" cy="52" rx="32" ry="6" fill="#a7f3d0" opacity="0.8"/>
    <circle cx="64" cy="80" r="28" fill="url(#liquidInnerGlow)"/>

    <!-- Rising Forest Spores / Bubbles -->
    <circle cx="50" cy="86" r="3" fill="#d1fae5" opacity="0.8"/>
    <circle cx="76" cy="80" r="2" fill="#d1fae5" opacity="0.85"/>
    <circle cx="58" cy="68" r="3.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="70" cy="94" r="2.5" fill="#a7f3d0" opacity="0.6"/>
  </g>

  <!-- Lumberjack Axe Emblem in center of flask -->
  <g filter="url(#axeGlow)">
    <!-- Wooden Handle -->
    <line x1="52" y1="88" x2="74" y2="60" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="52" y1="88" x2="74" y2="60" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <!-- Steel Axe Blade -->
    <path d="M72 58 Q82 54 84 64 Q78 72 70 70 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Axe Blade Shiny Edge -->
    <path d="M84 64 Q78 72 70 70" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Wood log icon in lower right corner of flask -->
  <g transform="translate(68, 86) scale(0.6)">
    <ellipse cx="14" cy="14" rx="10" ry="14" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="14" cy="14" rx="6" ry="9" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <circle cx="14" cy="14" r="1.5" fill="#92400e"/>
  </g>

  <!-- Leaf Accents around bottle neck -->
  <path d="M56 30 Q50 26 52 32 Z" fill="#4ade80"/>
  <path d="M72 30 Q78 26 76 32 Z" fill="#4ade80"/>

  <!-- Glass Highlight Reflections -->
  <path d="M35 66 L38 98" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
</svg>
