<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="energyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Flask Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="25%" stop-color="rgba(165,243,252,0.15)"/>
      <stop offset="75%" stop-color="rgba(6,182,212,0.2)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0.35)"/>
    </linearGradient>

    <!-- Elixir Liquid Gradient -->
    <linearGradient id="potionLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Liquid Glow -->
    <radialGradient id="liquidGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Cork Stopper Gradient -->
    <linearGradient id="corkWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="68" r="56" fill="url(#energyAura)"/>

  <!-- Bottle Drop Shadow -->
  <ellipse cx="64" cy="116" rx="36" ry="8" fill="rgba(0,0,0,0.4)"/>

  <!-- Cork Stopper -->
  <polygon points="56,12 72,12 70,26 58,26" fill="url(#corkWood)" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cork Neck Ring -->
  <ellipse cx="64" cy="27" rx="9" ry="2.5" fill="#d97706" stroke="#451a03" stroke-width="1"/>

  <!-- Glass Bottle Neck -->
  <rect x="57" y="26" width="14" height="16" fill="url(#glassBody)" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Main Round Bottle Body (Back Glass) -->
  <circle cx="64" cy="74" r="38" fill="url(#glassBody)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Liquid Clip Path -->
  <clipPath id="flaskClip">
    <circle cx="64" cy="74" r="36.5"/>
  </clipPath>

  <!-- Liquid Inside Flask -->
  <g clip-path="url(#flaskClip)">
    <!-- Liquid Base -->
    <rect x="24" y="52" width="80" height="65" fill="url(#potionLiquid)"/>
    
    <!-- Liquid Surface Wave -->
    <ellipse cx="64" cy="52" rx="36" ry="7" fill="#67e8f9" opacity="0.8"/>
    
    <!-- Inner Core Glow -->
    <circle cx="64" cy="78" r="30" fill="url(#liquidGlow)"/>

    <!-- Rising Energy Bubbles -->
    <circle cx="48" cy="88" r="3.5" fill="#ecfeff" opacity="0.7"/>
    <circle cx="78" cy="82" r="2.5" fill="#ecfeff" opacity="0.8"/>
    <circle cx="58" cy="64" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="72" cy="68" r="3" fill="#ffffff" opacity="0.75"/>
    <circle cx="44" cy="68" r="2" fill="#ecfeff" opacity="0.6"/>
  </g>

  <!-- Glowing Lightning Bolt Symbol in Center -->
  <g filter="url(#glowFilter)">
    <!-- Outer Bolt Glow -->
    <polygon points="68,44 50,72 63,72 58,102 78,68 65,68" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linejoin="round" opacity="0.8"/>
    <!-- Bolt Body -->
    <polygon points="68,44 50,72 63,72 58,102 78,68 65,68" fill="url(#lightning)" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- Glass Highlights & Specular Reflections (Front) -->
  <path d="M 38,54 A 36,36 0 0,1 60,39" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <path d="M 34,66 A 36,36 0 0,0 42,98" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="64" cy="30" rx="6" ry="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Energy Sparkles -->
  <polygon points="26,42 28,47 33,49 28,51 26,56 24,51 19,49 24,47" fill="#fef08a" opacity="0.9"/>
  <polygon points="102,48 104,52 108,54 104,56 102,60 100,56 96,54 100,52" fill="#67e8f9" opacity="0.85"/>
  <polygon points="94,88 95,91 98,92 95,93 94,96 93,93 90,92 93,91" fill="#a7f3d0" opacity="0.9"/>
</svg>
